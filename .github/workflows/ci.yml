name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install uv
        uv sync --frozen --no-dev

    - name: Lint with ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check with mypy
      run: |
        uv run mypy . --ignore-missing-imports
      continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker-compose build

    - name: Test Docker Compose
      run: |
        docker-compose up -d
        # 轮询等待两个服务 ready（BGE-M3 模型加载较慢，固定 sleep 可能不够）
        for i in $(seq 1 24); do
          if curl -sf http://localhost:8000/health >/dev/null 2>&1 && \
             curl -sf http://localhost:8001/health >/dev/null 2>&1; then
            break
          fi
          sleep 5
        done
        # 分别检查两个服务真实存在的 health endpoint：
        #   8000 -> import_service /health
        #   8001 -> query_service  /health
        curl -sf http://localhost:8000/health || exit 1
        curl -sf http://localhost:8001/health || exit 1
        docker-compose down
