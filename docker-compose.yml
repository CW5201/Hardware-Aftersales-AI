version: "3.8"

services:
  app:
    build: .
    container_name: langgraph-rag-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./:/app
      - /root/ai_models:/models
    depends_on:
      - milvus
      - mongo
      - minio

  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - milvus_logs:/var/log/milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: milvus-etcd
    restart: unless-stopped
    volumes:
      - etcd_data:/etcd

  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

volumes:
  milvus_data:
  milvus_logs:
  etcd_data:
  mongo_data:
  minio_data: