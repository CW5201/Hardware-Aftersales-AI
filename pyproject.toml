[project]
name = "LangGraph-RAG-Engine"
version = "1.0.0"
description = "A production-grade Agentic RAG system built with LangGraph, Milvus, and BGE-M3"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CW5201", email = "19317334773@163.com"}
]
requires-python = ">=3.11"
keywords = ["rag", "langgraph", "milvus", "bge-m3", "knowledge-base", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.136.1",
    "grandalf>=0.8",
    "langchain>=1.2.16",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.10",
    "minio>=7.2.20",
    "numpy>=2.4.4",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.0",
    "modelscope>=1.36.3",
    "openai-agents>=0.17.2",
    "dashscope>=1.25.18",
    "uvicorn[standard]>=0.47.0",
    "logger>=1.4",
    "path>=17.1.1",
]

[project.urls]
Homepage = "https://github.com/CW5201/LangGraph-RAG-Engine"
Documentation = "https://github.com/CW5201/LangGraph-RAG-Engine#readme"
Repository = "https://github.com/CW5201/LangGraph-RAG-Engine"
Issues = "https://github.com/CW5201/LangGraph-RAG-Engine/issues"
Changelog = "https://github.com/CW5201/LangGraph-RAG-Engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
