<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>悦答 AI</title>
  <style>
    :root{
      --bg:#f3f5f7;
      --panel:#ffffff;
      --text:#1f2d3d;
      --muted:#7a869a;
      --brand:#1aa7ff;
      --brand2:#5b7cfa;
      --bubble-user:#1aa7ff;
      --bubble-bot:#ffffff;
      --border:#e6e9ef;
      --shadow:0 10px 30px rgba(31,45,61,.12);
      --sidebar-bg:#f7f8fa;
      --hover-bg:#eef1f5;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
    }
    .app{
      width:100%;
      height:100vh;
      display:flex;
      overflow:hidden;
    }
    /* ========== 左侧边栏 ========== */
    .sidebar{
      width:260px;
      background:var(--sidebar-bg);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      flex-shrink:0;
    }
    .sidebar-header{
      padding:16px;
      border-bottom:1px solid var(--border);
    }
    .search-box{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:8px;
      font-size:14px;
      color:var(--muted);
    }
    .search-box input{
      border:none;
      outline:none;
      flex:1;
      font-size:14px;
      background:transparent;
    }
    .search-icon{font-size:16px;color:var(--muted)}

    .sidebar-nav{
      padding:12px 8px;
    }
    .nav-btn{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
      color:var(--text);
      text-decoration:none;
      border:none;
      background:none;
      width:100%;
      text-align:left;
      transition:background .15s;
    }
    .nav-btn:hover{background:var(--hover-bg)}
    .nav-btn.active{background:var(--hover-bg);font-weight:500}

    .history-list{
      flex:1;
      overflow:auto;
      padding:0 8px 16px;
    }
    .history-label{
      font-size:12px;
      color:var(--muted);
      padding:12px 12px 8px;
    }
    .history-item{
      padding:10px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      transition:background .15s;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .history-item-text{
      flex:1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .history-delete{
      display:none;
      flex-shrink:0;
      width:18px;
      height:18px;
      border:none;
      border-radius:4px;
      background:#ff4d4f;
      color:#fff;
      font-size:10px;
      cursor:pointer;
      line-height:1;
      padding:0;
    }
    .history-item:hover .history-delete{display:block}
    .history-item:hover{background:var(--hover-bg)}
    .history-item.active{background:var(--hover-bg);font-weight:500}

    .sidebar-footer{
      padding:12px 16px;
      border-top:1px solid var(--border);
      font-size:13px;
      color:var(--muted);
    }

    /* ========== 右侧主区域 ========== */
    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      min-width:0;
      background:var(--panel);
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--border);
      background:var(--panel);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:240px;
    }
    .logo{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 8px 18px rgba(26,167,255,.25);
    }
    .title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .title strong{font-size:14px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
    }
    .btn{
      border:none;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .chat{
      flex:1;
      overflow:auto;
      padding:16px 0 10px;
      background:var(--panel);
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:6px 0 14px;
    }
    .msg{
      display:flex;
      gap:10px;
      margin:14px 40px;
      align-items:flex-start;
    }
    .msg.user{justify-content:flex-end}
    .msg > div{
      flex:1;
      min-width:0;
    }
    .msg.user > div{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .bubble{
      max-width:min(720px, 80%);
      display:inline-block;
      border-radius:14px;
      padding:10px 14px;
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap: break-word;
    }
    .msg.bot .bubble{
      background:transparent;
      padding:0;
      max-width:100%;
    }
    .msg.user .bubble{
      background:#f0f0f0;
      color:var(--text);
      border-radius:14px;
    }
    .answer-text h1,.answer-text h2,.answer-text h3,.answer-text h4,.answer-text h5,.answer-text h6{
      margin:12px 0 6px;
      font-weight:600;
      line-height:1.4;
    }
    .answer-text h1{font-size:20px}
    .answer-text h2{font-size:17px}
    .answer-text h3{font-size:15px}
    .answer-text p{margin:6px 0;line-height:1.7}
    .answer-text ul,.answer-text ol{margin:6px 0 6px 20px;padding:0}
    .answer-text li{margin:3px 0;line-height:1.6}
    .answer-text blockquote{
      margin:8px 0;
      padding:8px 12px;
      border-left:3px solid var(--brand);
      background:rgba(26,167,255,.05);
      border-radius:0 8px 8px 0;
      color:#555;
    }
    .answer-text code{
      background:#f0f0f0;
      padding:2px 5px;
      border-radius:4px;
      font-size:13px;
      font-family:monospace;
    }
    .answer-refs{
      margin-top:12px;
      padding-top:10px;
      border-top:1px solid #eee;
    }
    .refs-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }
    .ref-item{
      font-size:12px;
      color:#888;
      padding:2px 0;
    }
    .progress-step{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
    }
    .progress-wrap{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }

    .answer-images{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .answer-images img{
      display: block;
      max-width: min(100%, 600px);
      max-height: 600px;
      width: auto;
      height: auto;
      border-radius:12px;
      border:1px solid var(--border);
      box-shadow:0 10px 24px rgba(31,45,61,.10);
      background:#fff;
    }
    .answer-images a{
      font-size:12px;
      color:var(--muted);
      text-decoration:none;
      word-break:break-all;
    }

    .typing{
      display:inline-flex;gap:6px;align-items:center;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:#9aa6b2;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.6}
      40%{transform:translateY(-5px);opacity:1}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:12px 14px 8px;
      display:flex;
      flex-direction:column;
      background:#fff;
    }
    .composer-row{
      display:flex;
      gap:10px;
      align-items:flex-end;
    }
    textarea{
      flex:1;
      resize:none;
      min-height:44px;
      max-height:140px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.5;
    }
    textarea:focus{border-color:rgba(26,167,255,.6); box-shadow:0 0 0 3px rgba(26,167,255,.12)}
    .send{
      width:88px;
      height:44px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      color:#fff;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{
      padding:0 14px 8px;
      color:var(--muted);
      font-size:12px;
      background:#fff;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:#f7f9fc;
      color:#3b4a5a;
    }
    .toolbar{
      display:flex;
      align-items:center;
      gap:4px;
      padding:6px 0 2px;
      flex-wrap:wrap;
    }
    .toolbar-btn{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:4px 10px;
      border:none;
      border-radius:6px;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      cursor:pointer;
      white-space:nowrap;
      transition:background .15s,color .15s;
    }
    .toolbar-btn:hover{background:var(--hover-bg);color:var(--text)}
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="search-box"><input type="text" placeholder="搜索..." /></div>
      </div>
      <div class="sidebar-nav">
        <button class="nav-btn active">+ 新对话</button>
        <a href="http://47.120.58.250:8000/import.html" class="nav-btn" style="margin-top:8px;">添加知识库</a>
      </div>
      <div class="history-label">历史对话</div>
      <div class="history-list" id="historyList"></div>
    </div>
    <div class="main">
    <div class="topbar">
      <div class="brand">
        <div class="title">
          <strong>悦答 AI</strong>
          <span id="subTitle">在线 · 你的智能知识助手</span>
        </div>
      </div>
      <div class="top-actions">
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--muted);margin-right:10px;">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill" style="display:none">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div>
          <div class="bubble">你好！我是智小问。有什么我可以帮你的？你可以直接提问。</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-row">
        <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      </div>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
    </div>
  </div>

  <script>

    const API_BASE = window.location.origin;
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send') || {disabled:false};
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');
    const historyList = document.getElementById('historyList');
    const newChatBtn = document.querySelector('.nav-btn.active');

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    // 会话管理
    async function loadSessions(){
      try{
        const res = await fetch(`${API_BASE}/sessions`);
        if(!res.ok) return;
        const data = await res.json();
        const sessions = data.sessions || [];
        renderSessionList(sessions);
      }catch(_){}
    }

    function renderSessionList(sessions){
      historyList.innerHTML = '';
      for(const s of sessions){
        const div = document.createElement('div');
        div.className = 'history-item' + (s.session_id === sessionId ? ' active' : '');
        const title = (s.title || '新对话').slice(0, 30);
        div.innerHTML = `<span class="history-item-text">${escapeHtml(title)}</span><button class="history-delete" onclick="event.stopPropagation();deleteSession('${s.session_id}')" title="删除会话">✕</button>`;
        div.onclick = () => switchSession(s.session_id);
        historyList.appendChild(div);
      }
    }

    async function deleteSession(sid){
      if(!sid) return;
      if(!confirm('确定删除该会话？')) return;
      try{
        const res = await fetch(`${API_BASE}/sessions/${sid}`, { method: 'DELETE' });
        if(res.ok){
          if(sid === sessionId) newChat();
          loadSessions();
        }
      }catch(_){}
    }

    function switchSession(newSessionId){
      sessionId = newSessionId;
      localStorage.setItem('kb_session_id', sessionId);
      // 清空当前聊天区
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      // 加载历史
      loadHistory();
      // 刷新会话列表高亮
      loadSessions();
    }

    function newChat(){
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
      // 清空聊天区
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      // 刷新会话列表
      loadSessions();
    }

    newChatBtn.onclick = newChat;

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function renderMarkdown(src){
      const lines = String(src || '').split('\n');
      let html = '';
      let inUl = false, inOl = false;
      for(let line of lines){
        let trimmed = line.trimEnd();
        // 空行
        if(trimmed === ''){
          if(inUl){html += '</ul>'; inUl = false}
          if(inOl){html += '</ol>'; inOl = false}
          continue;
        }
        // 标题
        const hMatch = trimmed.match(/^(#{1,6})\s+(.*)/);
        if(hMatch){
          if(inUl){html += '</ul>'; inUl = false}
          if(inOl){html += '</ol>'; inOl = false}
          const level = hMatch[1].length;
          html += `<h${level}>${inlineMd(hMatch[2])}</h${level}>`;
          continue;
        }
        // 无序列表
        const ulMatch = trimmed.match(/^[-*+]\s+(.*)/);
        if(ulMatch){
          if(inOl){html += '</ol>'; inOl = false}
          if(!inUl){html += '<ul>'; inUl = true}
          html += `<li>${inlineMd(ulMatch[1])}</li>`;
          continue;
        }
        // 有序列表
        const olMatch = trimmed.match(/^\d+[.)]\s+(.*)/);
        if(olMatch){
          if(inUl){html += '</ul>'; inUl = false}
          if(!inOl){html += '<ol>'; inOl = true}
          html += `<li>${inlineMd(olMatch[1])}</li>`;
          continue;
        }
        // 引用
        if(trimmed.startsWith('> ')){
          if(inUl){html += '</ul>'; inUl = false}
          if(inOl){html += '</ol>'; inOl = false}
          html += `<blockquote>${inlineMd(trimmed.slice(2))}</blockquote>`;
          continue;
        }
        // 普通段落
        if(inUl){html += '</ul>'; inUl = false}
        if(inOl){html += '</ol>'; inOl = false}
        html += `<p>${inlineMd(trimmed)}</p>`;
      }
      if(inUl) html += '</ul>';
      if(inOl) html += '</ol>';
      return html;
    }
    function inlineMd(s){
      return String(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.innerHTML = renderMarkdown(text);
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls, references){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div>
            <div class="bubble"><div class="answer"></div></div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
        renderReferences(answerEl, references || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div style="min-width: 180px;">
            <div class="bubble">
              <div class="progress-wrap">
                <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
                <div class="progress-step"></div>
              </div>
            </div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const wrap = botMsgEl.querySelector('.progress-wrap');
      const stepEl = botMsgEl.querySelector('.progress-step');
      if(!wrap) return;
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];

      // 如果最后完成的是"生成答案"，隐藏整个进度区域
      if(done.length > 0 && done[done.length - 1] === '生成答案'){
        wrap.style.display = 'none';
        return;
      }

      // 显示当前步骤名
      if(stepEl){
        if(running.length > 0){
          stepEl.textContent = running[running.length - 1];
        }else if(done.length > 0){
          stepEl.textContent = done[done.length - 1];
        }else{
          stepEl.textContent = '处理中...';
        }
      }
    }

    function renderReferences(containerEl, refs){
      if(!refs || refs.length === 0) return;
      const wrap = document.createElement('div');
      wrap.className = 'answer-refs';
      const label = document.createElement('div');
      label.className = 'refs-label';
      label.textContent = '参考资料';
      wrap.appendChild(label);
      for(const ref of refs){
        const item = document.createElement('div');
        item.className = 'ref-item';
        const name = ref.name || '';
        const source = ref.source === 'web' ? '网络' : '知识库';
        item.textContent = `${name}（${source}）`;
        wrap.appendChild(item);
      }
      containerEl.appendChild(wrap);
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls, references){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('.progress-wrap');
      const err = (error || '').trim();

      if(err){
        if(progress) progress.remove();
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        return;
      }

      if(progress) progress.remove();
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      renderReferences(answerEl, references || []);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || [], item.references || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || [], data.references || []);
          sendBtn.disabled = false;
          loadSessions();
          return;
        }

        const { session_id } = data;
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('.progress-wrap');
          if(progress) progress.style.display = 'none';
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
            renderReferences(answerEl, d.references || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('.progress-wrap');
          if(progress) progress.style.display = 'none';
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
            renderReferences(answerEl, d.references || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('.progress-wrap');
          if(progress) progress.style.display = 'none';
          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('.progress-wrap');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        if(progress) progress.style.display = 'none';
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}`;
        sendBtn.disabled = false;
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
      loadSessions();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    loadSessions();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
